[pytest]
# ============================================================
# Test discovery
# ============================================================
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ============================================================
# Output and reporting
# ============================================================
# -v: verbose test names
# -ra: show extra info for all non-pass results (skipped, failed, errors)
# --strict-markers: fail if undeclared markers are used (prevents typos)
# --tb=short: shorter traceback for readability
addopts =
    -v
    -ra
    --strict-markers
    --tb=short

# ============================================================
# Custom markers — describe test categories
# Usage: pytest -m security  (runs only security-tagged tests)
# ============================================================
markers =
    smoke: critical path tests that must always pass
    regression: full regression suite (slower, comprehensive)
    security: security-focused tests (headers, auth, injection)
    bdd: tests driven by Gherkin .feature files
    slow: tests that take more than 5 seconds (skip with -m "not slow")

# ============================================================
# BDD configuration (pytest-bdd)
# ============================================================
bdd_features_base_dir = tests/features

# ============================================================
# Playwright defaults
# ============================================================
# Base URL is used by pytest-base-url and pytest-playwright fixtures
# Override via CLI: pytest --base-url=https://other-target.com