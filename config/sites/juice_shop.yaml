# ============================================================
# Site configuration: OWASP Juice Shop
# ============================================================
# This file declares everything site-specific so that test
# logic stays generic and reusable across multiple targets.

name: "OWASP Juice Shop"
base_url: "http://localhost:3000"
# ------------------------------------------------------------
# Expected security headers
# Used by: audits/headers_auditor.py
# Each header declares whether it's required, its risk severity
# if missing, and remediation guidance for the audit report.
# ------------------------------------------------------------
security_headers:
  X-Frame-Options:
    required: true
    severity: medium
    remediation: "Set 'X-Frame-Options: SAMEORIGIN' to prevent clickjacking attacks."
  X-Content-Type-Options:
    required: true
    severity: medium
    remediation: "Set 'X-Content-Type-Options: nosniff' to prevent MIME-type sniffing."
  Content-Security-Policy:
    required: true
    severity: high
    remediation: "Define a Content-Security-Policy to mitigate XSS and data injection attacks."
  Strict-Transport-Security:
    required: false
    severity: high
    remediation: "Add 'Strict-Transport-Security' to enforce HTTPS and prevent downgrade attacks."
  Referrer-Policy:
    required: false
    severity: low
    remediation: "Set 'Referrer-Policy' to control referrer information leakage."
  Permissions-Policy:
    required: false
    severity: low
    remediation: "Set 'Permissions-Policy' to restrict access to browser features."

# ------------------------------------------------------------
# Cookie security policy
# Used by: audits/cookies_auditor.py
# Defines which flags cookies should have and the severity if missing.
# 'enforce_on' controls scope: 'all' checks every cookie, or list
# specific cookie names to check only those.
# ------------------------------------------------------------
cookie_policy:
  enforce_on: all
  required_flags:
    secure:
      severity: high
      remediation: "Set the 'Secure' flag so cookies are only sent over HTTPS."
    httponly:
      severity: high
      remediation: "Set the 'HttpOnly' flag to prevent JavaScript access (XSS mitigation)."
    samesite:
      severity: medium
      remediation: "Set 'SameSite' (Strict or Lax) to mitigate CSRF attacks."

# ------------------------------------------------------------
# CORS policy expectations
# Used by: audits/cors_auditor.py
# Flags overly permissive Cross-Origin Resource Sharing settings.
# ------------------------------------------------------------
cors_policy:
  # Wildcard Allow-Origin lets any site read responses — flag it.
  disallow_wildcard_origin:
    severity: medium
    remediation: "Avoid 'Access-Control-Allow-Origin: *'. Specify explicit trusted origins."
  # Wildcard origin combined with credentials is a critical misconfiguration.
  disallow_wildcard_with_credentials:
    severity: high
    remediation: "Never combine 'Access-Control-Allow-Origin: *' with 'Access-Control-Allow-Credentials: true'."

# ------------------------------------------------------------
# Information disclosure policy
# Used by: audits/disclosure_auditor.py
# Lists response headers that leak technology stack details and
# should NOT be present. Their presence is a finding.
# ------------------------------------------------------------
disclosure_policy:
  # Headers that reveal server/framework details to attackers.
  forbidden_headers:
    Server:
      severity: low
      remediation: "Remove or obfuscate the 'Server' header to hide web server type and version."
    X-Powered-By:
      severity: low
      remediation: "Remove 'X-Powered-By' to avoid revealing the backend framework."
    X-AspNet-Version:
      severity: medium
      remediation: "Remove 'X-AspNet-Version' to hide the .NET framework version."
    X-AspNetMvc-Version:
      severity: medium
      remediation: "Remove 'X-AspNetMvc-Version' to hide the ASP.NET MVC version."
    X-Generator:
      severity: low
      remediation: "Remove 'X-Generator' to avoid revealing the CMS or generator."

# ------------------------------------------------------------
# UI selectors (site-specific)
# Used by: pages/juice_shop/*.py
# Centralizing selectors here means a markup change = one edit.
# ------------------------------------------------------------
selectors:
  login:
    email_input: "#email"
    password_input: "#password"
    submit_button: "#loginButton"
  navigation:
    dismiss_welcome: "button[aria-label='Close Welcome Banner']"
    dismiss_cookie: "a[aria-label='dismiss cookie message']"

# ------------------------------------------------------------
# Test payloads for input-based security checks
# Used by: pages/ objects and security tests
# Centralizing payloads here keeps attack strings configurable
# per target, separate from test logic.
# ------------------------------------------------------------
payloads:
  sql_injection:
    - "' OR 1=1--"
    - "' OR '1'='1"
    - "admin'--"
  xss:
    - "<script>alert(1)</script>"
    - "\"><img src=x onerror=alert(1)>"
  # Placeholder value for the password field during payload-based login
  # attempts (the password is often irrelevant when injecting via email).
  placeholder_password: "placeholder"
